[package]
name = "starlight-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[features]
default = ["desktop-ui"]
desktop-ui = ["dep:tauri", "dep:tauri-build", "dep:souvlaki", "dep:tauri-plugin-opener", "dep:tauri-plugin-single-instance", "dep:objc2"]

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dependencies]
tauri = { version = "2", optional = true, features = ["tray-icon"] }
souvlaki = { version = "0.9.3", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
rquickjs = { version = "0.14", default-features = false, features = ["std"] }
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }

[[bin]]
name = "starlight-desktop"
path = "src/main.rs"
required-features = ["desktop-ui"]
